name: Redirect to the LAPIG repository

# The site lives at https://lapig-ufg.github.io/time2graze-workshop/ now.
# This repository no longer hosts the site: it serves one page per route,
# which forwards every visitor (and every old link) to the LAPIG Pages site.
# The forwarding preserves the path and the hash, so a link to
# /time2graze-workshop/programme/#d3-lunch lands on the same session at the
# LAPIG address.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4